[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-system"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "yfinance",
    "requests",
]

[tool.setuptools.packages.find]
where = ["."]
